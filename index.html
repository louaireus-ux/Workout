<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151A17">
<meta name="description" content="Muscle heatmap workout log. Logged work heats the muscles it hits, then fades back to cold.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Workout Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#151A17;--board-2:#1E2621;--board-3:#252E27;--chalk:#ECE7D7;--chalk-2:#C9C6B6;--dim:#8D9488;--faint:#5C645B;
    --line:rgba(236,231,215,.15);--line-2:rgba(236,231,215,.28);
    --green:#79C64C;--green-d:#5DA337;--gold:#E4AB3E;--red:#DB6140;--green-soft:rgba(121,198,76,.14);--gold-soft:rgba(228,171,62,.14);--red-soft:rgba(219,97,64,.14);--danger:#E06A4A;
    --radius:14px;--shadow:0 2px 10px rgba(0,0,0,.35);
    --chalkfont:"Caveat","Bradley Hand",cursive;
    --bodyfont:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--board);background-image:radial-gradient(120% 80% at 50% -10%,rgba(121,198,76,.05),transparent 60%),radial-gradient(100% 60% at 50% 120%,rgba(0,0,0,.5),transparent 55%);background-attachment:fixed;color:var(--chalk);font-family:var(--bodyfont);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;padding:0 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh;}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important;}}
  .wrap{max-width:620px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-left)) 0 calc(18px + env(safe-area-inset-right));}
  header{padding:8px 2px 4px;}
  .kicker{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:2px;}
  h1{font-family:var(--chalkfont);font-weight:700;font-size:46px;line-height:.95;margin:0;color:var(--chalk);text-shadow:0 1px 0 rgba(0,0,0,.4);text-wrap:balance;}
  .uline{display:block;height:10px;width:180px;margin:2px 0 0;}
  .subhead{color:var(--dim);font-size:13px;margin-top:8px;display:flex;gap:8px;align-items:center;letter-spacing:.02em;flex-wrap:wrap;}
  .subhead .dot{width:4px;height:4px;border-radius:50%;background:var(--faint);}
  .subhead .saved{color:var(--green);font-weight:600;}
  .warnbar{background:var(--red-soft);border:1px solid var(--red);border-radius:11px;padding:11px 13px;margin:14px 0 0;font-size:13px;line-height:1.5;color:var(--chalk);}
  .warnbar b{color:var(--red);}
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:16px -2px 10px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day-chip{flex:0 0 auto;background:var(--board-2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;text-align:left;transition:all .15s ease;font-family:inherit;}
  .day-chip .letter{font-family:var(--chalkfont);font-weight:700;font-size:22px;line-height:.9;display:block;color:var(--chalk-2);}
  .day-chip .focus{display:block;font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.04em;text-transform:uppercase;}
  .day-chip.active{background:var(--board-3);border-color:var(--green);}
  .day-chip.active .letter{color:var(--green);}
  .day-chip.solo .letter{font-family:var(--bodyfont);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}

  .status-card{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .st-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;}
  .st-rank{font-family:var(--chalkfont);font-weight:700;font-size:30px;line-height:.9;color:var(--green);}
  .st-lvl{font-size:12px;color:var(--dim);margin-top:2px;letter-spacing:.03em;}
  .st-badge{width:46px;height:46px;border-radius:50%;border:2px dashed var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--chalkfont);font-weight:700;font-size:24px;color:var(--green);flex:0 0 auto;}
  .ops-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:6px;}
  .ops-bar{height:10px;border-radius:6px;background:var(--board-3);border:1px solid var(--line);overflow:hidden;}
  .ops-fill{height:100%;background:linear-gradient(90deg,var(--green-d),var(--green));border-radius:6px;transition:width .5s ease;}

  .sectitle{font-family:var(--chalkfont);font-weight:700;font-size:22px;color:var(--chalk);margin:4px 2px 10px;letter-spacing:.5px;}
  .bodywrap{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px 6px;box-shadow:var(--shadow);margin-bottom:12px;}
  .bodywrap svg{width:100%;height:auto;display:block;}
  .mz{cursor:pointer;transition:fill .5s ease;stroke:rgba(236,231,215,.34);stroke-width:.35;}
  .mz:active{stroke:var(--chalk);stroke-width:.7;}
  .anat-base{fill:#20281F;stroke:rgba(236,231,215,.18);stroke-width:.35;pointer-events:none;}
  .fig-label{fill:var(--dim);font-family:var(--bodyfont);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;}
  .maphint{text-align:center;color:var(--dim);font-size:12px;margin:2px 4px 12px;letter-spacing:.02em;}
  .legend{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 2px;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
  .legend .bar{width:130px;height:8px;border-radius:6px;background:linear-gradient(90deg,#2C352F,#4F9E36,#CE942E,#D65A3A);}

  .engine{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:14px;cursor:pointer;}
  .engine-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:10px;}
  .engine-top .t{font-family:var(--chalkfont);font-weight:700;font-size:22px;}
  .engine-top .pct{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;}
  .engine-bar{height:12px;border-radius:8px;background:var(--board-3);overflow:hidden;border:1px solid var(--line);}
  .engine-fill{height:100%;border-radius:8px;transition:width .5s ease,background .5s ease;}
  .engine-sub{font-size:12px;color:var(--dim);margin-top:8px;}

  .coach{background:var(--board-2);border:1px solid var(--gold);border-radius:var(--radius);padding:15px;margin-bottom:16px;box-shadow:var(--shadow);}
  .coach h3{font-family:var(--chalkfont);font-weight:700;font-size:22px;margin:0 0 10px;color:var(--gold);}
  .coach p.read{margin:0;font-size:14.5px;line-height:1.6;color:var(--chalk);}
  .goalbox{background:var(--board-3);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:11px;}
  .glabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:5px;}
  .goaltext{margin:0;font-size:14px;line-height:1.5;color:var(--chalk);}
  .linkbtn{border:none;background:none;color:var(--green);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 0 0;font-family:inherit;}
  .goal-edit{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;background:var(--board);color:var(--chalk);min-height:96px;resize:vertical;}
  .favline{font-size:12px;color:var(--dim);margin:0 0 12px;line-height:1.5;}
  .favline b{color:var(--gold);}
  .coach .acts{display:flex;gap:8px;margin-top:10px;}.coach .acts .btn{flex:1;}

  .btn{border:none;border-radius:11px;padding:12px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.02em;}
  .btn-add{width:100%;background:var(--board-2);border:1.5px dashed var(--line-2);color:var(--dim);margin-top:2px;}
  .btn-add:hover{border-color:var(--green);color:var(--green);}
  .btn-ghost{background:var(--board-3);color:var(--chalk-2);border:1px solid var(--line);}
  .btn-green{background:var(--green-d);color:#0F140F;}
  .warmup{width:100%;display:flex;align-items:center;gap:12px;background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:2px 0 16px;cursor:pointer;transition:all .18s ease;box-shadow:var(--shadow);text-align:left;font-family:inherit;color:inherit;}
  .warmup .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:all .18s ease;}
  .warmup .tick svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:all .18s ease;}
  .warmup .label{font-weight:700;font-size:15px;display:block;}
  .warmup .sub{font-size:12.5px;color:var(--dim);margin-top:1px;display:block;}
  .warmup.done{background:var(--green-soft);border-color:var(--green);}
  .warmup.done .tick{background:var(--green);border-color:var(--green);}
  .warmup.done .tick svg{opacity:1;transform:scale(1);stroke:#0F140F;}
  .warmup.done .label{color:var(--green);}
  .ex{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px 8px;margin-bottom:12px;box-shadow:var(--shadow);}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:11px;margin-bottom:10px;}
  .ex-title{flex:1;min-width:0;}
  .extick{width:28px;height:28px;border-radius:50%;border:2px solid var(--faint);background:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin-top:1px;transition:all .18s ease;}
  .extick svg{width:15px;height:15px;opacity:0;transform:scale(.5);transition:all .18s ease;stroke:#0F140F;}
  .ex.done{background:var(--green-soft);border-color:var(--green);}
  .ex.done .extick{background:var(--green);border-color:var(--green);}
  .ex.done .extick svg{opacity:1;transform:scale(1);}
  .ex.done .ex-name{color:var(--green);}
  .numtoggle{border:none;background:none;color:var(--dim);font-weight:700;font-size:12.5px;padding:2px 2px 8px;cursor:pointer;font-family:inherit;letter-spacing:.02em;}
  .daycard{background:var(--board-2);border:1px solid var(--gold);border-radius:var(--radius);padding:15px;margin-bottom:14px;box-shadow:var(--shadow);}
  .daycard label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;display:block;margin:0 0 5px;}
  .daycard input{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:10px;font-size:15px;font-family:inherit;background:var(--board);color:var(--chalk);}
  .dayrow{display:flex;gap:9px;}
  .dayrow .btn{flex:1;padding:10px 8px;font-size:13px;}
  .dayrow .btn[disabled]{opacity:.35;cursor:default;}
  .day-chip.addday .letter{color:var(--green);}
  .picker{max-height:46vh;overflow-y:auto;margin:6px -2px 0;}
  .pick{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 3px;border-top:1px solid var(--line);cursor:pointer;}
  .pick:first-child{border-top:none;}
  .pick:active{background:var(--board-3);}
  .pick .n{font-weight:700;font-size:14.5px;color:var(--chalk);}
  .pick .d{font-size:12px;color:var(--dim);margin-top:1px;}
  .pick .pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);flex:0 0 auto;}
  .ex-name{font-weight:700;font-size:16.5px;line-height:1.15;color:var(--chalk);}
  .ex-target{font-size:12px;color:var(--gold);font-weight:600;margin-top:3px;letter-spacing:.03em;}
  .ex-last{font-size:11.5px;color:var(--dim);margin-top:4px;}
  .starbtn{border:none;background:none;font-size:22px;line-height:1;color:var(--faint);cursor:pointer;padding:0 2px;flex:0 0 auto;font-family:inherit;}
  .starbtn.on{color:var(--gold);}
  .set-row{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:8px;align-items:center;padding:5px 0;}
  .set-n{font-size:12px;color:var(--faint);font-weight:700;text-align:center;}
  .set-row input{width:100%;background:var(--board);border:1px solid var(--line);border-radius:9px;padding:9px 8px;font-size:15px;font-family:inherit;color:var(--chalk);text-align:center;font-variant-numeric:tabular-nums;}
  .set-row input:focus{outline:none;border-color:var(--green);}
  .set-row input::placeholder{color:var(--faint);font-weight:400;}
  .set-del{border:none;background:none;color:var(--faint);font-size:16px;cursor:pointer;padding:4px;font-family:inherit;}
  .col-head{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:8px;padding:0 0 2px;}
  .col-head span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;}
  .addset{border:none;background:none;color:var(--green);font-weight:700;font-size:13px;padding:8px 2px 6px;cursor:pointer;font-family:inherit;}
  .edit-name{font-weight:700;font-size:16px;width:100%;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;background:var(--board);color:var(--chalk);font-family:inherit;}
  .edit-target{display:flex;gap:6px;margin-top:6px;align-items:center;}
  .edit-target input{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--board);color:var(--chalk);width:56px;text-align:center;font-family:inherit;}
  .edit-target input.reps{width:78px;}
  .ex-x{border:none;background:none;color:var(--danger);font-size:13px;font-weight:700;padding:2px 4px;cursor:pointer;margin-left:auto;font-family:inherit;}
  .toolbar{display:flex;justify-content:flex-end;margin:2px 2px 12px;}
  .edit-toggle{background:var(--board-2);border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-family:inherit;}
  .edit-toggle.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .addform{background:var(--board-2);border:1px solid var(--green);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .addform label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;display:block;margin:0 0 4px;}
  .addform input{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:10px;font-size:15px;font-family:inherit;background:var(--board);color:var(--chalk);margin-bottom:10px;}
  .addform .row2{display:flex;gap:10px;}.addform .row2 > div{flex:1;}
  .addform .acts{display:flex;gap:8px;}.addform .acts .btn{flex:1;}
  .seg{display:flex;gap:8px;margin-bottom:12px;}
  .seg button{flex:1;border:1px solid var(--line);background:var(--board-2);border-radius:11px;padding:11px;font-family:inherit;font-weight:700;font-size:14px;color:var(--dim);cursor:pointer;letter-spacing:.03em;}
  .seg button.on{background:var(--board-3);color:var(--green);border-color:var(--green);}
  .field{margin-bottom:12px;}
  .field label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;display:block;margin:0 0 5px;}
  .field input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:var(--board);color:var(--chalk);}
  .field .row2{display:flex;gap:10px;}.field .row2 > div{flex:1;}
  .cardcard{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:14px;}
  .suggest{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
  .suggest:first-child{border-top:none;}
  .suggest .n{font-weight:700;font-size:14.5px;color:var(--chalk);}
  .suggest .d{font-size:12.5px;color:var(--dim);}
  .suggest .pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);flex:0 0 auto;}
  .suggest .pill.bike{background:var(--gold-soft);color:var(--gold);}
  .gear{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;}
  .gchip{border:1px solid var(--line);background:var(--board-2);border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .gchip.on{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .gchip.lock{opacity:.7;cursor:default;}
  .gchip .rm{color:var(--danger);font-weight:700;}
  .hist-card{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
  .hist-date{font-family:var(--chalkfont);font-weight:700;font-size:20px;color:var(--chalk);}
  .hist-day{font-size:10.5px;color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
  .hist-wu{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex:0 0 auto;}
  .hist-wu.yes{background:var(--green-soft);color:var(--green);}
  .hist-wu.no{background:var(--board-3);color:var(--faint);}
  .hist-ex{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:14px;color:var(--chalk-2);}
  .hist-ex .v{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;}
  .hist-del{border:none;background:none;color:var(--danger);font-size:12px;font-weight:700;cursor:pointer;padding:8px 0 0;font-family:inherit;}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;}
  .empty .big{font-family:var(--chalkfont);font-size:26px;color:var(--chalk);margin-bottom:6px;}
  .databox{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:14px;}
  .databox p{margin:0 0 12px;font-size:13px;color:var(--dim);line-height:1.55;}
  .datarow{display:flex;gap:9px;flex-wrap:wrap;}
  .datarow .btn{flex:1;min-width:130px;}
  .datastat{font-size:12px;color:var(--dim);margin-top:12px;font-variant-numeric:tabular-nums;}
  .datastat b{color:var(--chalk-2);}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--board-2);border-radius:22px 22px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:41;max-height:78vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.5);border-top:1px solid var(--line-2);}
  .sheet.show{transform:translateY(0);}
  .grab{width:38px;height:4px;background:var(--line-2);border-radius:3px;margin:6px auto 12px;}
  .sheet h2{font-family:var(--chalkfont);font-weight:700;font-size:28px;margin:0 0 2px;color:var(--chalk);}
  .sheet .status{font-size:13px;color:var(--dim);margin-bottom:14px;}
  .sheet .status b{color:var(--gold);}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--chalk);color:var(--board);font-size:13px;font-weight:700;padding:9px 18px;border-radius:30px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:60;max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{text-align:center;padding:70px 20px;color:var(--dim);font-family:var(--chalkfont);font-size:24px;}
</style>

</head>
<body>
<div class="wrap">
  <header>

const STORE_KEY='wazeer.readiness.v1';

let storageOk=(function(){try{localStorage.setItem('__rb_probe','1');localStorage.removeItem('__rb_probe');return true;}catch(e){return false;}})();

let plan,sessions,cardio,equip,goalText;

function snapshot(){return{v:1,savedAt:Date.now(),plan:plan,sessions:sessions.filter(function(s){return !emptyS(s);}),cardio:cardio,equipment:equip,goal:goalText};}
function commit(quiet){
  if(!storageOk){renderWarn();return;}
  try{
    var payload=snapshot();
    localStorage.setItem(STORE_KEY,JSON.stringify(payload));
    lastSaved=payload.savedAt;
    updateSavedLine();
    if(!quiet)flash('Saved');
  }catch(e){storageOk=false;renderWarn();flash('Could not save — storage is full or blocked');}
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){commit(true);},400);}
function flash(msg){var t=document.getElementById('toast');t.textContent=msg||'Saved';t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1400);}
function updateSavedLine(){
  var el=document.getElementById('savedline');
  if(!storageOk){el.textContent='Not saving';el.style.color='var(--red)';return;}
  el.style.color='var(--green)';
  if(!lastSaved){el.textContent='Saved on this device';return;}
  var d=new Date(lastSaved),p=function(n){return String(n).padStart(2,'0');};
  el.textContent='Saved '+p(d.getHours())+':'+p(d.getMinutes());
}
function renderWarn(){
  var el=document.getElementById('warn');
  el.innerHTML=storageOk?'':'<div class="warnbar"><b>Nothing is being saved.</b> This browser is blocking site storage, usually a private window or a "block site data" setting. Open the board in a normal window, or your log disappears when you close the tab.</div>';
}

/* ---------------- helpers ---------------- */
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function fmtDate(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});}
function daysAgo(s){var a=s.split('-').map(Number);var then=new Date(a[0],a[1]-1,a[2]);var now=new Date();now.setHours(0,0,0,0);return Math.round((now-then)/86400000);}
function uid(){return 'x'+Math.random().toString(36).slice(2,8);}
function dayById(id){return plan.days.find(function(d){return d.id===id;});}
function dayTag(d){return d.tag||d.id||'?';}
function parseRep(rep){var p=String(rep||'').split('\u00d7');var n=parseInt(p[0],10);return{sets:(n>0?n:3),reps:(p[1]||'8-12').trim()};}
function normalisePlan(){
  if(!plan||!Array.isArray(plan.days))plan={days:[]};
  plan.days.forEach(function(d,i){
    if(!d.id)d.id=uid();
    if(!d.tag)d.tag=String(i+1);
    if(!Array.isArray(d.exercises))d.exercises=[];
  });
}
function allDone(s,day){return day.exercises.length>0&&day.exercises.every(function(ex){var e=s.entries[ex.id];return e&&e.done;});}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function emptyS(s){if(s.warmup)return false;return !Object.values(s.entries||{}).some(function(e){return e.done||e.sets.some(function(x){return x.w||x.r;});});}
function favList(){var r=[];plan.days.forEach(function(d){d.exercises.forEach(function(e){if(e.fav)r.push(e.name);});});return r;}
function autoMuscles(name){var low=name.toLowerCase();var hit=EX_LIB.find(function(x){return low.includes(x.n.toLowerCase())||x.n.toLowerCase().includes(low);});return hit?hit.m:{};}
function icon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';}

function currentSession(){
  var d=today();var s=sessions.find(function(x){return x.date===d&&x.dayId===view;});
  if(!s){s={date:d,dayId:view,warmup:false,entries:{}};sessions.push(s);}
  var dref=dayById(view);
  if(dref)s.dayName=dayTag(dref)+' · '+(dref.focus||dref.name||'');
  dayById(view).exercises.forEach(function(ex){
    if(!s.entries[ex.id])s.entries[ex.id]={name:ex.name,m:ex.m||{},sets:Array.from({length:ex.sets},function(){return{w:'',r:''};})};
    else if(!s.entries[ex.id].m)s.entries[ex.id].m=ex.m||{};
  });
  return s;
}
function lastFor(exId){
  var d=today();
  var prev=sessions.filter(function(s){return s.date<d&&s.entries[exId];}).sort(function(a,b){return b.date<a.date?-1:1;});
  for(var i=0;i<prev.length;i++){
    var done=prev[i].entries[exId].sets.filter(function(x){return x.w||x.r;});
    if(done.length){
      var top=done.reduce(function(a,b){return (parseFloat(b.w)||0)>(parseFloat(a.w)||0)?b:a;});
      return (top.w?top.w+'kg':'')+(top.w&&top.r?' × ':'')+(top.r?top.r:'');
    }
  }
  return null;
}
function weekStart(){var d=new Date();var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);d.setHours(0,0,0,0);return d;}
function stats(){
  var strengthDone=sessions.filter(function(s){return !emptyS(s);});
  var total=strengthDone.length+cardio.length;
  var level=Math.floor(total/5)+1;
  var rank=total>=50?'Elite':total>=25?'Specialist':total>=10?'Operator':'Recruit';
  var ws=weekStart();
  var inWk=function(s){var a=s.date.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])>=ws;};
  var wk=strengthDone.filter(inWk).length+cardio.filter(inWk).length;
  return{total:total,level:level,rank:rank,wk:wk};
}

/* ---------------- heat engine ---------------- */
function computeHeat(){
  var h={};MUSCLES.forEach(function(m){h[m]=0;});var engine=0;var lastDay={};
  sessions.forEach(function(s){
    var rec=Math.max(0,1-daysAgo(s.date)/DECAY_STR);if(rec<=0)return;
    Object.values(s.entries).forEach(function(e){
      var worked=e.sets.filter(function(x){return x.w||x.r;}).length;
      if(!worked&&e.done)worked=e.sets.length;
      if(!worked)return;
      var mm=(e.m&&Object.keys(e.m).length)?e.m:autoMuscles(e.name);
      Object.entries(mm).forEach(function(pair){
        var mus=pair[0],w=pair[1];
        if(h[mus]===undefined)return;
        h[mus]=Math.min(1,h[mus]+w*SET_UNIT*worked*rec);
        if(w>=.6&&(lastDay[mus]===undefined||daysAgo(s.date)<lastDay[mus]))lastDay[mus]=daysAgo(s.date);
      });
    });
  });
  cardio.forEach(function(c){
    var recC=Math.max(0,1-daysAgo(c.date)/DECAY_CARD);
    var recS=Math.max(0,1-daysAgo(c.date)/DECAY_STR);
    var im=c.intensity==='Hard'?1.4:c.intensity==='Tempo'?1.2:1;
    var vol=(c.min||30)/40;
    engine=Math.min(1,engine+0.5*vol*im*recC);
    if(recS>0){Object.entries(CARDIO_M[c.type]||{}).forEach(function(pair){h[pair[0]]=Math.min(1,h[pair[0]]+pair[1]*vol*im*0.18*recS);});}
  });
  return{h:h,engine:engine,lastDay:lastDay};
}
function heatColor(v){
  v=Math.max(0,Math.min(1,v));
  var stops=[[0,[0x2C,0x35,0x2F]],[0.45,[0x4F,0x9E,0x36]],[0.75,[0xCE,0x94,0x2E]],[1,[0xD6,0x5A,0x3A]]];
  for(var i=1;i<stops.length;i++){
    if(v<=stops[i][0]){
      var p0=stops[i-1][0],c0=stops[i-1][1],p1=stops[i][0],c1=stops[i][1];
      var t=(v-p0)/(p1-p0||1);
      return 'rgb('+c0.map(function(x,j){return Math.round(x+(c1[j]-x)*t);}).join(',')+')';
    }
  }
  return 'rgb(214,90,58)';
}
function bodySVG(){
  var h=computeHeat().h;
  var draw=function(list){return list.map(function(o){
    var fill=o.mus?heatColor(h[o.mus]):'#20281F';
    var attr=o.mus?(' class="mz" data-muscle="'+o.mus+'"'):' class="anat-base"';
    return o.pts.map(function(p){return '<polygon'+attr+' fill="'+fill+'" points="'+p+'"/>';}).join('');
  }).join('');};
  var s='<svg viewBox="0 0 200 206" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muscle heat map, front and back">';
  s+='<g>'+draw(ANATOMY.front)+'</g><g transform="translate(100 0)">'+draw(ANATOMY.back)+'</g>';
  s+='<text x="50" y="204" text-anchor="middle" class="fig-label">Front</text><text x="150" y="204" text-anchor="middle" class="fig-label">Back</text></svg>';
  return s;
}

/* ---------------- the briefing ----------------
   Reads the same live heat the board draws: coldest muscles, what is
   still recovering, which plan day covers the gaps best, engine, goal. */
function joinNames(arr){
  var n=arr.map(function(m){return MLABEL[m].toLowerCase();});
  if(n.length===1)return n[0];
  if(n.length===2)return n[0]+' and '+n[1];
  return n.slice(0,-1).join(', ')+' and '+n[n.length-1];
}
function firstSentence(t){
  var s=String(t||'').trim();if(!s)return '';
  var m=s.match(/^[^.!?]{1,160}[.!?]/);
  return (m?m[0]:s.slice(0,160)).replace(/[.!?]\s*$/,'');
}
function buildBriefing(){
  var r=computeHeat(),h=r.h,engine=r.engine,lastDay=r.lastDay;
  var logged=sessions.filter(function(s){return !emptyS(s);}).length+cardio.length;
  var favs=favList();
  var out=[];
  var goalLine=firstSentence(goalText);

  if(!logged){
    var first=plan.days[0];
    out.push('The board is blank, every muscle reads cold, so there is nothing to recover from and no wrong place to start.');
    out.push('Open with '+first.name+', the '+first.focus.toLowerCase()+' day, and log every set as you go so the map has something real to work from.');
    out.push(favs.length?('Lead with '+favs[0]+' to make the session feel like yours.'):'Tap the star on the lifts you actually enjoy and they will start shaping these reads.');
    if(goalLine)out.push('Mission still reads: '+goalLine+'.');
    return out.join(' ');
  }

  var ranked=MUSCLES.slice().sort(function(a,b){
    if(h[a]!==h[b])return h[a]-h[b];
    var la=lastDay[a]===undefined?999:lastDay[a],lb=lastDay[b]===undefined?999:lastDay[b];
    return lb-la;
  });
  var cold=ranked.slice(0,3);
  var hot=MUSCLES.filter(function(m){return h[m]>=0.5;}).sort(function(a,b){return h[b]-h[a];}).slice(0,2);

  var never=cold.filter(function(m){return lastDay[m]===undefined;});
  var staleNote='';
  if(never.length){staleNote=' Nothing on record for '+joinNames(never.slice(0,2))+' at all.';}
  else{
    var worst=cold.reduce(function(a,b){return (lastDay[b]||0)>(lastDay[a]||0)?b:a;});
    if(lastDay[worst]>=6)staleNote=' '+MLABEL[worst]+' last took real load '+lastDay[worst]+' days ago.';
  }
  out.push(joinNames(cold).replace(/^./,function(c){return c.toUpperCase();})+' are reading coldest right now.'+staleNote);

  out.push(hot.length
    ?(joinNames(hot).replace(/^./,function(c){return c.toUpperCase();})+' '+(hot.length>1?'are':'is')+' still carrying load from the last few days, so leave '+(hot.length>1?'them':'it')+' to finish recovering.')
    :'Nothing is deep in recovery, so you have a clear run at whatever you pick.');

  var scored=plan.days.map(function(d){
    var sc=0;
    d.exercises.forEach(function(e){
      Object.entries(e.m||{}).forEach(function(pair){if(h[pair[0]]!==undefined)sc+=pair[1]*(1-h[pair[0]]);});
    });
    return{d:d,sc:sc};
  }).sort(function(a,b){return b.sc-a.sc;});
  var pick=scored[0].d;
  var pickFav=pick.exercises.filter(function(e){return e.fav;})[0];
  out.push('Run '+pick.name+' next, the '+pick.focus.toLowerCase()+' day, because it lands hardest on what has faded'
    +(pickFav?(', and '+pickFav.name+' is already sitting in it.'):'.'));

  var pct=Math.round(engine*100);
  var eng=pct<25?('Aerobic engine is down at '+pct+'%, so get an easy run or a steady ride in this week before the base slips any further.')
    :pct<60?('Engine is ticking over at '+pct+'%, one more easy session keeps that base honest.')
    :('Engine is strong at '+pct+'%, it is the strength side that wants the attention now.');
  out.push(eng+(goalLine?(' Mission still reads: '+goalLine+'.'):''));

  return out.join(' ');
}

  else h+='<p class="goaltext">'+esc(goalText)+'</p><button class="linkbtn" data-action="goal-edit">Edit</button>';
  h+='</div>';
  h+='<div class="favline">Favourite lifts fed to the read: '+(favs.length?'<b>'+esc(favs.join(', '))+'</b>':'none yet, tap ☆ on any lift')+'</div>';

function renderDay(){
  var day=dayById(view),s=currentSession();var h='';
  var done=allDone(s,day);
  h+='<div class="toolbar"><button class="edit-toggle'+(editMode?' on':'')+'" data-action="edit">'+(editMode?'Done editing':'Edit workout')+'</button></div>';

  if(editMode){
    var idx=plan.days.indexOf(day);
    h+='<div class="daycard"><div class="glabel">This workout</div>';
    h+='<div class="dayrow"><div style="flex:0 0 74px"><label for="d-tag">Tab</label><input id="d-tag" data-field="dtag" value="'+esc(dayTag(day))+'" maxlength="6"></div>';
    h+='<div style="flex:1"><label for="d-name">Name</label><input id="d-name" data-field="dname" value="'+esc(day.name||'')+'"></div></div>';
    h+='<div style="margin-top:10px"><label for="d-focus">Focus</label><input id="d-focus" data-field="dfocus" value="'+esc(day.focus||'')+'" placeholder="e.g. Push, Legs, Upper"></div>';
    h+='<div class="dayrow" style="margin-top:12px">';
    h+='<button class="btn btn-ghost" data-action="daymove" data-dir="-1"'+(idx<=0?' disabled':'')+'>◀ Move</button>';
    h+='<button class="btn btn-ghost" data-action="daymove" data-dir="1"'+(idx>=plan.days.length-1?' disabled':'')+'>Move ▶</button>';
    h+='<button class="btn btn-ghost" data-action="daydel" style="color:var(--danger)">Delete</button>';
    h+='</div></div>';
  }

  h+='<button class="warmup'+(s.warmup?' done':'')+'" data-action="warmup"><span class="tick">'+icon()+'</span><span><span class="label">Warm-up'+(s.warmup?' done':'')+'</span><span class="sub">8–10 min · bike, dynamic circuit, ramp sets</span></span></button>';

  if(!editMode&&day.exercises.length){
    h+='<button class="btn '+(done?'btn-ghost':'btn-green')+'" data-action="alldone" style="width:100%;margin-bottom:14px">'+(done?'Clear all ticks':'Tick everything done')+'</button>';
  }

  day.exercises.forEach(function(ex){
    var e=s.entries[ex.id],last=lastFor(ex.id);
    h+='<div class="ex'+(e.done?' done':'')+'">';
    if(editMode){
      h+='<input class="edit-name" data-field="name" data-ex="'+ex.id+'" value="'+esc(ex.name)+'"><div class="edit-target"><input data-field="sets" data-ex="'+ex.id+'" value="'+esc(ex.sets)+'" inputmode="numeric"><span style="color:var(--faint)">×</span><input class="reps" data-field="reps" data-ex="'+ex.id+'" value="'+esc(ex.reps)+'"><button class="ex-x" data-action="delex" data-ex="'+ex.id+'">Remove ✕</button></div>';
    }else{
      h+='<div class="ex-head">';
      h+='<button class="extick" data-action="exdone" data-ex="'+ex.id+'" aria-label="Mark done">'+icon()+'</button>';
      h+='<div class="ex-title"><div class="ex-name">'+esc(ex.name)+'</div><div class="ex-target">'+esc(ex.sets)+' × '+esc(ex.reps)+'</div>'+(last?'<div class="ex-last">Last: '+esc(last)+'</div>':'')+'</div>';
      h+='<button class="starbtn'+(ex.fav?' on':'')+'" data-action="fav" data-ex="'+ex.id+'" aria-label="Favourite">'+(ex.fav?'★':'☆')+'</button></div>';
      h+='<button class="numtoggle" data-action="numbers" data-ex="'+ex.id+'">'+(openSets[ex.id]?'Hide numbers':'Add weight and reps')+'</button>';
      if(openSets[ex.id]){
        h+='<div class="col-head"><span>Set</span><span>Weight</span><span>Reps</span><span></span></div>';
        e.sets.forEach(function(st,i){
          h+='<div class="set-row"><span class="set-n">'+(i+1)+'</span><input inputmode="decimal" placeholder="kg" data-field="w" data-ex="'+ex.id+'" data-set="'+i+'" value="'+esc(st.w)+'"><input inputmode="numeric" placeholder="reps" data-field="r" data-ex="'+ex.id+'" data-set="'+i+'" value="'+esc(st.r)+'"><button class="set-del" data-action="delset" data-ex="'+ex.id+'" data-set="'+i+'" aria-label="Delete set">✕</button></div>';
        });
        h+='<button class="addset" data-action="addset" data-ex="'+ex.id+'">+ Add set</button>';
      }
    }
    h+='</div>';
  });

  if(!day.exercises.length)h+='<div class="empty"><div class="big">Nothing in here yet</div>Add the exercises you actually do.</div>';

  if(adding){
    var q=addQuery.trim().toLowerCase();
    var opts=EX_LIB.filter(function(x){
      if(!x.e.every(function(k){return k==='bodyweight'||equip.includes(k);}))return false;
      if(!q)return true;
      return x.n.toLowerCase().indexOf(q)>-1||Object.keys(x.m).some(function(m){return MLABEL[m].toLowerCase().indexOf(q)>-1;});
    }).slice(0,40);
    h+='<div class="addform"><label for="ax-q">Add an exercise</label>';
    h+='<input id="ax-q" data-field="axq" placeholder="Search, or type your own name" value="'+esc(addQuery)+'" autocomplete="off">';
    if(addQuery.trim())h+='<button class="btn btn-green" data-action="addcustom" style="width:100%;margin-bottom:4px">Add “'+esc(addQuery.trim())+'” as my own</button>';
    h+='<div class="picker">';
    if(!opts.length)h+='<p class="maphint" style="text-align:left;margin:8px 4px">Nothing in the library matches. Type a name and add it as your own.</p>';
    opts.forEach(function(x){
      h+='<div class="pick" data-action="addlib" data-n="'+esc(x.n)+'"><div><div class="n">'+esc(x.n)+'</div><div class="d">'+Object.keys(x.m).map(function(m){return esc(MLABEL[m]);}).join(' · ')+'</div></div><span class="pill">'+esc(x.rep)+'</span></div>';
    });
    h+='</div><div class="acts" style="margin-top:10px"><button class="btn btn-ghost" data-action="addex-cancel" style="width:100%">Done adding</button></div></div>';
  }
  else h+='<button class="btn btn-add" data-action="addex-open">+ Add exercise</button>';

  if(editMode)h+='<button class="btn btn-add" data-action="addday" style="margin-top:10px">+ Add another workout</button>';

  document.getElementById('content').innerHTML=h;
}

function renderHistory(){
  var strength=sessions.filter(function(s){return !emptyS(s);}).map(function(s){var o=Object.assign({},s);o.kind='s';return o;});
  var car=cardio.map(function(c){var o=Object.assign({},c);o.kind='c';return o;});
  var all=strength.concat(car).sort(function(a,b){return b.date<a.date?-1:(b.date>a.date?1:0);});
  var h='';
  if(!all.length)h='<div class="empty"><div class="big">No ops logged</div>Log a session or a run and it shows up here.</div>';
  all.forEach(function(s){
    if(s.kind==='c'){
      h+='<div class="hist-card"><div class="hist-top"><div><div class="hist-date">'+fmtDate(s.date)+'</div><div class="hist-day">'+esc(s.type)+' · '+esc(s.intensity)+'</div></div><span class="hist-wu yes">'+esc(s.min||'?')+' min'+(s.km?' · '+esc(s.km)+' km':'')+'</span></div><button class="hist-del" data-action="delcardio" data-id="'+esc(s.id)+'">Delete</button></div>';
    }else{
      var day=dayById(s.dayId);
      h+='<div class="hist-card"><div class="hist-top"><div><div class="hist-date">'+fmtDate(s.date)+'</div><div class="hist-day">'+esc(day?(dayTag(day)+' · '+(day.focus||day.name||'')):(s.dayName||s.dayId))+'</div></div><span class="hist-wu '+(s.warmup?'yes':'no')+'">'+(s.warmup?'Warm-up ✓':'No warm-up')+'</span></div>';
      Object.values(s.entries).forEach(function(e){
        var sets=e.sets.filter(function(x){return x.w||x.r;});
        if(!sets.length&&!e.done)return;
        var v=sets.length?sets.map(function(x){return (x.w||'–')+(x.r?'×'+x.r:'');}).join('  '):'Done ✓';
        h+='<div class="hist-ex"><span>'+esc(e.name)+'</span><span class="v">'+esc(v)+'</span></div>';
      });
      h+='<button class="hist-del" data-action="delsession" data-date="'+esc(s.date)+'" data-day="'+esc(s.dayId)+'">Delete</button></div>';
    }
  });
  document.getElementById('content').innerHTML=h;
}

function render(){
  renderDays();
  if(view==='body')renderBody();
  else if(view==='cardio')renderCardio();
  else if(view==='gear')renderGear();
  else if(view==='history')renderHistory();
  else renderDay();
}

/* ---------------- sheet ---------------- */
function openSheet(o){sheet=o;renderSheet();document.getElementById('scrim').classList.add('show');document.getElementById('sheet').classList.add('show');}
function closeSheet(){sheet=null;document.getElementById('scrim').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
function renderSheet(){
  var el=document.getElementById('sheet');var h='<div class="grab"></div>';
  if(sheet&&sheet.type==='muscle'){
    var r=computeHeat(),heat=r.h,lastDay=r.lastDay;var id=sheet.id;var dz=lastDay[id];
    var status=dz===undefined?'Not trained recently':(dz===0?'Trained today':dz===1?'Trained yesterday':'Trained '+dz+' days ago');
    h+='<h2>'+esc(MLABEL[id])+'</h2><div class="status"><b>'+Math.round(heat[id]*100)+'%</b> hot · '+status+'</div>';
    var opts=EX_LIB.filter(function(x){return (x.m[id]||0)>=0.6&&x.e.every(function(k){return k==='bodyweight'||equip.includes(k);});}).sort(function(a,b){return (b.m[id]||0)-(a.m[id]||0);});
    if(!opts.length)h+='<p class="maphint" style="text-align:left">No matches with your loadout. Switch on more in Gear.</p>';
    opts.forEach(function(x){h+='<div class="suggest"><div><div class="n">'+esc(x.n)+'</div><div class="d">'+x.e.map(function(k){return esc(EQ_LABEL[k]||k);}).join(' · ')+'</div></div><span class="pill">'+esc(x.rep)+'</span></div>';});
  }else if(sheet&&sheet.type==='cardio'){
    var engine=computeHeat().engine;
    h+='<h2>Aerobic engine</h2><div class="status"><b>'+Math.round(engine*100)+'%</b> · run and bike base</div>';
    CARDIO_LIB.forEach(function(c){h+='<div class="suggest"><div><div class="n">'+esc(c.n)+'</div><div class="d">'+esc(c.d)+'</div></div><span class="pill '+(c.tag==='bike'?'bike':'')+'">'+c.tag+'</span></div>';});
  }
  el.innerHTML=h;
}

/* ---------------- backup ---------------- */
async function exportBackup(){
  var name='workout-board-'+today()+'.json';
  var text=JSON.stringify(snapshot(),null,2);
  try{
    var dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:text});flash('Backup saved');return;}
  }catch(e){flash('Backup cancelled');return;}
  try{
    var blob=new Blob([text],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);
    flash('Backup saved');
  }catch(e){flash('Could not save the backup here');}
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||typeof d!=='object'||!d.plan||!Array.isArray(d.sessions))throw new Error('shape');
      plan=d.plan;sessions=d.sessions;cardio=Array.isArray(d.cardio)?d.cardio:[];
      equip=Array.isArray(d.equipment)?d.equipment:DEFAULT_EQUIP.slice();
      goalText=d.goal||DEFAULT_GOAL;coachText=null;
      commit();render();flash('Backup loaded');
    }catch(e){flash('That file is not a Workout Board backup');}
  };
  fr.onerror=function(){flash('Could not read that file');};
  fr.readAsText(file);
}

/* ---------------- events ---------------- */
document.getElementById('days').addEventListener('click',function(e){
  if(e.target.closest('[data-action="addday"]')){
    var nd={id:uid(),tag:String(plan.days.length+1),name:'New workout',focus:'',exercises:[]};
    plan.days.push(nd);view=nd.id;editMode=true;adding=false;commit(true);render();return;
  }
  var b=e.target.closest('[data-view]');if(!b)return;
  view=b.dataset.view;editMode=false;adding=false;render();
});
document.getElementById('scrim').addEventListener('click',closeSheet);
document.getElementById('importfile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  if(f)importBackup(f);
  e.target.value='';
});

var content=document.getElementById('content');
content.addEventListener('click',function(e){
  var mus=e.target.closest('[data-muscle]');if(mus){openSheet({type:'muscle',id:mus.dataset.muscle});return;}
  var eng=e.target.closest('[data-eng]');if(eng){openSheet({type:'cardio'});return;}
  var t=e.target.closest('[data-action],[data-ctype],[data-cint],[data-gear]');if(!t)return;
  if(t.dataset.ctype){cType=t.dataset.ctype;renderCardio();return;}
  if(t.dataset.cint){cInt=t.dataset.cint;renderCardio();return;}
  if(t.dataset.gear&&!t.dataset.action){
    var k=t.dataset.gear;
    if(equip.includes(k))equip=equip.filter(function(x){return x!==k;});else equip.push(k);
    commit(true);renderGear();return;
  }
  var a=t.dataset.action;
  var s=plan.days.some(function(d){return d.id===view;})?currentSession():null;

  if(a==='warmup'){s.warmup=!s.warmup;queueSave();renderDay();}
  else if(a==='addset'){s.entries[t.dataset.ex].sets.push({w:'',r:''});queueSave();renderDay();}
  else if(a==='delset'){s.entries[t.dataset.ex].sets.splice(+t.dataset.set,1);queueSave();renderDay();}
  else if(a==='edit'){editMode=!editMode;adding=false;renderDay();}
  else if(a==='fav'){var ex=dayById(view).exercises.find(function(x){return x.id===t.dataset.ex;});ex.fav=!ex.fav;coachText=null;commit(true);renderDay();}
  else if(a==='addex-open'){adding=true;addQuery='';renderDay();}
  else if(a==='addex-cancel'){adding=false;addQuery='';renderDay();}
  else if(a==='numbers'){openSets[t.dataset.ex]=!openSets[t.dataset.ex];renderDay();}
  else if(a==='exdone'){var en=s.entries[t.dataset.ex];en.done=!en.done;queueSave();renderDay();}
  else if(a==='alldone'){
    var turnOn=!allDone(s,dayById(view));
    dayById(view).exercises.forEach(function(ex){s.entries[ex.id].done=turnOn;});
    commit();renderDay();
  }
  else if(a==='addlib'){
    var lib=EX_LIB.find(function(x){return x.n===t.dataset.n;});
    if(lib){var pr=parseRep(lib.rep);dayById(view).exercises.push({id:uid(),name:lib.n,sets:pr.sets,reps:pr.reps,m:lib.m});commit(true);}
    renderDay();
  }
  else if(a==='addcustom'){
    var nm=addQuery.trim();
    if(nm){dayById(view).exercises.push({id:uid(),name:nm,sets:3,reps:'8-12',m:autoMuscles(nm)});addQuery='';commit(true);}
    renderDay();
  }
  else if(a==='addday'){
    var nd={id:uid(),tag:String(plan.days.length+1),name:'New workout',focus:'',exercises:[]};
    plan.days.push(nd);view=nd.id;editMode=true;adding=false;commit(true);render();
  }
  else if(a==='daymove'){
    var i=plan.days.indexOf(dayById(view)),j=i+(+t.dataset.dir);
    if(j>=0&&j<plan.days.length){var tmp=plan.days[i];plan.days[i]=plan.days[j];plan.days[j]=tmp;commit(true);render();}
  }
  else if(a==='daydel'){
    var dd=dayById(view);
    if(confirm('Delete \u201c'+(dd.name||dayTag(dd))+'\u201d? Sessions you already logged against it stay in History.')){
      plan.days=plan.days.filter(function(x){return x.id!==dd.id;});
      view=plan.days.length?plan.days[0].id:'body';editMode=false;commit();render();
    }
  }
  else if(a==='delex'){
    var day=dayById(view);day.exercises=day.exercises.filter(function(x){return x.id!==t.dataset.ex;});
    if(s)delete s.entries[t.dataset.ex];
    commit(true);renderDay();
  }
  else if(a==='delsession'){sessions=sessions.filter(function(x){return !(x.date===t.dataset.date&&x.dayId===t.dataset.day);});commit();renderHistory();}
  else if(a==='delcardio'){cardio=cardio.filter(function(x){return x.id!==t.dataset.id;});commit();renderHistory();}
  else if(a==='clog'){
    var min=parseInt(document.getElementById('c-min').value,10)||0;
    var km=document.getElementById('c-km').value.trim();
    if(min>0){cardio.push({id:uid(),date:today(),type:cType,intensity:cInt,min:min,km:km});coachText=null;commit();view='body';render();}
    else flash('Add the minutes first');
  }
  else if(a==='gearadd'){
    var v=document.getElementById('g-name').value.trim();
    if(v&&!equip.includes(v)){equip.push(v);commit(true);}
    renderGear();
  }
  else if(a==='gearrm'){equip=equip.filter(function(x){return x!==t.dataset.gear;});commit(true);renderGear();}
  else if(a==='goal-edit'){editingGoal=true;renderBody();}
  else if(a==='goal-cancel'){editingGoal=false;renderBody();}
  else if(a==='goal-save'){
    var g=document.getElementById('goal-in').value.trim();
    if(g)goalText=g;
    coachText=null;editingGoal=false;commit();renderBody();
  }
  else if(a==='coach'){coachText=buildBriefing();renderBody();}
  else if(a==='export'){exportBackup();}
  else if(a==='import'){document.getElementById('importfile').click();}
  else if(a==='wipe'){
    if(confirm('Erase the whole log — every session, cardio entry, plan edit and favourite — from this browser? Export a backup first if you want it back.')){
      try{localStorage.removeItem(STORE_KEY);}catch(e){}
      boot(true);flash('Log erased');
    }
  }
});
content.addEventListener('input',function(e){
  var el=e.target,f=el.dataset.field;if(!f)return;
  if(f==='axq'){addQuery=el.value;var c=el.selectionStart;renderDay();var b=document.getElementById('ax-q');if(b){b.focus();try{b.setSelectionRange(c,c);}catch(_){}}return;}
  if(f==='dtag'){dayById(view).tag=el.value;queueSave();renderDays();return;}
  if(f==='dname'){dayById(view).name=el.value;queueSave();return;}
  if(f==='dfocus'){dayById(view).focus=el.value;queueSave();renderDays();return;}
  if(f==='w'||f==='r'){currentSession().entries[el.dataset.ex].sets[+el.dataset.set][f]=el.value;queueSave();}
  else if(f==='name'){var ex=dayById(view).exercises.find(function(x){return x.id===el.dataset.ex;});ex.name=el.value;ex.m=autoMuscles(el.value);queueSave();}
  else if(f==='sets'){var e2=dayById(view).exercises.find(function(x){return x.id===el.dataset.ex;});e2.sets=parseInt(el.value,10)||1;queueSave();}
  else if(f==='reps'){var e3=dayById(view).exercises.find(function(x){return x.id===el.dataset.ex;});e3.reps=el.value;queueSave();}
});
window.addEventListener('beforeunload',function(){if(saveTimer){clearTimeout(saveTimer);commit(true);}});

/* ---------------- boot ---------------- */
function boot(fresh){
  var d=null;
  if(!fresh&&storageOk){try{var raw=localStorage.getItem(STORE_KEY);d=raw?JSON.parse(raw):null;}catch(e){d=null;}}
  plan=(d&&d.plan)?d.plan:JSON.parse(JSON.stringify(DEFAULT_PLAN));
  sessions=(d&&Array.isArray(d.sessions))?d.sessions:[];
  cardio=(d&&Array.isArray(d.cardio))?d.cardio:[];
  equip=(d&&Array.isArray(d.equipment))?d.equipment:DEFAULT_EQUIP.slice();
  goalText=(d&&d.goal)?d.goal:DEFAULT_GOAL;
  lastSaved=(d&&d.savedAt)?d.savedAt:null;
  normalisePlan();
  openSets={};addQuery='';
  view='body';editMode=false;adding=false;editingGoal=false;coachText=null;
  document.getElementById('today').textContent=fmtDate(today());
  renderWarn();updateSavedLine();render();
}
boot(false);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
</body>
</html>
